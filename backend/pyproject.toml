[project]
name = "lco-attendance-backend"
version = "0.1.0"
description = "FastAPI backend for LCO attendance desktop app"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "fastapi[standard]>=0.163.2",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.9",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
